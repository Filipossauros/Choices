name: Deploy to GitHub Pages

# GitHub Pages for this repo serves from the `gh-pages` branch
# (Settings → Pages → Source: "Deploy from a branch"). This workflow
# builds the app and publishes the contents of dist/ to that branch,
# so the live site at https://filipossauros.github.io/Macbeth/ stays
# in sync on every push.

on:
  push:
    branches: ['main', 'claude/bold-bell-xllznr']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
